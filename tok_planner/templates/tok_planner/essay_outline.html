{% extends 'ibsitemain/base.html' %}
{% block title %}TOK Essay Outline{% endblock %}
{% block content %}
<main class="ee-page">
  <h1>Essay Outline Builder</h1>
  <p>Build your essay: Introduction, Claims, Counterclaims, and Conclusion.</p>

  <form method="post" class="filter-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="cas-button">Save outline</button>
  </form>
</main>
{% endblock %}
