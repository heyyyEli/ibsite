{% extends 'ibsitemain/base.html' %}
{% block title %}TOK Objects{% endblock %}
{% block content %}
<main class="ee-page">
  <h1>Curated Objects</h1>
  <div class="ideas-grid">
    {% for obj in objects %}
      <div class="idea-card">
        <h3>{{ obj.name }}</h3>
        {% if obj.image %}
          <img src="{{ obj.image.url }}" alt="{{ obj.name }}" style="max-width: 100%; border-radius: 8px;">
        {% endif %}
        <p>{{ obj.description }}</p>
      </div>
    {% empty %}
      <p>No objects yet. Upload in Admin.</p>
    {% endfor %}
  </div>
</main>
{% endblock %}
