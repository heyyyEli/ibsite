{% extends 'ibsitemain/base.html' %}
{% block title %}TOK Exhibition Prompts{% endblock %}
{% block content %}
<main class="ee-page">
  <h1>Exhibition Prompts</h1>
  <div class="ideas-grid">
    {% for p in prompts %}
      <div class="idea-card">
        <p>{{ p.text }}</p>
      </div>
    {% empty %}
      <p>No exhibition prompts uploaded yet.</p>
    {% endfor %}
  </div>
</main>
{% endblock %}
