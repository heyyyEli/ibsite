{% extends 'ibsitemain/base.html' %}
{% block title %}Create EE Timeline{% endblock %}
{% block content %}
<main class="ee-page">
  <h1>Create your EE timeline</h1>
  <p>Confirm your subject, topic, and dates to auto‑generate milestones.</p>

  <form method="post" class="filter-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="cas-button">Generate timeline</button>
  </form>
</main>
{% endblock %}
